<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lumen - Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/components.js"></script>
</head>

<body>
    <smart-nav></smart-nav>
    <main>
        <div class="page-header">
            <button class="menu-toggle-btn" onclick="toggleNav()">☰</button>
            <h1>Security System</h1>
        </div>

        <div class="security-grid-container"
            style="display: grid; grid-template-columns: 1fr; max-width: 500px; margin: 0 auto;">
            <div class="security-badge-card"
                style="backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 20px; padding: 30px; box-shadow: var(--shadow-soft); border: 1px solid rgba(255,255,255,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 15px;">
                <div>
                    <h3 class="m-0">Global Protection Shield</h3>
                    <div class="flex-row flex-center" style="margin: 20px 0; justify-content: flex-start;">
                        <span id="shield-icon-huge" style="font-size: 4em;">🛡️</span>
                        <div>
                            <h4 class="text-muted m-0"
                                style="text-transform: uppercase; font-size: 0.85em; letter-spacing: 0.5px;">System
                                Status</h4>
                            <h2 class="m-0" id="txt-alarm-status" style="margin-top: 5px;">System Armed</h2>
                        </div>
                    </div>
                </div>
                <div class="flex-row" style="margin: 0; gap: 10px; display: flex; width: 100%;">
                    <button id="btn-arm-total" class="btn-full" onclick="openPinPopup('armed')"
                        style="background: var(--success-color); color: white; flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Arm</button>
                    <button id="btn-disarm-total" class="btn-full" onclick="openPinPopup('disarmed')"
                        style="background: var(--error-color); color: white; flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Disarm</button>
                </div>
                <button class="btn-full" onclick="executeTotalSecurity()"
                    style="background: var(--accent-color); color: white; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 1em;">⚡
                    Quick Home Secure</button>
            </div>
        </div>

        <h2 class="hk-section-title">Surveillance and Detection Equipment</h2>
        <div class="info-banner">
            <p class="page-subtitle" style="margin-bottom: 0;">Monitor live video cameras, motion sensors, and the
                status of windows/doors.</p>
        </div>
        <div id="security-devices-container" class="hk-grid"></div>
    </main>
    <smart-modal></smart-modal>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/app.js"></script>
</body>

</html>
