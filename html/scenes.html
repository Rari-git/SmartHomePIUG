<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lumen - Scenes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/components.js"></script>
</head>

<body>
    <smart-nav></smart-nav>
    <main>
        <div class="page-header">
            <button class="menu-toggle-btn" onclick="toggleNav()">☰</button>
            <h1>Scenes</h1>
        </div>
        <p class="page-subtitle">Choose a scene or configure your own custom scenes for your smart home.</p>

        <div class="hk-grid-wide mb-20" id="all-scenes-container"></div>

        <h2 class="hk-section-title">Custom Scenes</h2>
        <div class="hk-grid-wide">
            <div class="card-add-custom-scene" onclick="openCreateScenePopup()">
                <div class="plus-icon"><i class="ph-bold ph-plus"></i></div>
                <div class="scene-info">
                    <div class="scene-title">Create Custom Scene</div>
                    <div class="scene-desc">Complete manual configuration</div>
                </div>
            </div>
        </div>
    </main>
    <smart-modal></smart-modal>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/app.js"></script>
</body>

</html>
