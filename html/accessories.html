<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lumen - Accessories</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/components.js"></script>
</head>

<body>
    <smart-nav></smart-nav>
    <main>
        <div class="page-header">
            <button class="menu-toggle-btn" onclick="toggleNav()">☰</button>
            <h1>All Accessories</h1>
        </div>
        <p>Click on an item to turn it off/on. Click the star (★) to pin it to the Home page. Click (⚙️) for
            volume/intensity/system removal.</p>
        <div id="all-accessories-container"></div>

        <h2 class="hk-section-title" style="margin-top: 30px;">Add New Accessory</h2>
        <div class="hk-grid">
            <div class="hk-card card-add-new" onclick="openAddAccessoryModal()">
                <div class="plus-icon"><i class="ph-bold ph-plus"></i></div>
                <div class="add-title">Add Accessory</div>
                <div class="add-desc">Add a new device</div>
            </div>
        </div>
    </main>

    <div id="popup-add-accessory" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAddAccessoryModal()">&times;</span>
            <h2 style="margin-top: 0; color: var(--accent-color);"><i class="ph-bold ph-plus-circle"></i> Add New
                Accessory</h2>
            <div class="form-row">
                <label>Accessory Name:</label>
                <input type="text" id="new-acc-name" class="form-input" placeholder="e.g.: Desk Lamp">
            </div>
            <div class="form-row">
                <label>Category (Device Type):</label>
                <select id="new-acc-category" class="form-input">
                    <option value="bulbs">Bulbs</option>
                    <option value="rgbLights">RGB Lights</option>
                    <option value="plugs">Smart Plugs</option>
                    <option value="appliances">Appliances</option>
                    <option value="audio">Audio Systems</option>
                    <option value="tv">TV</option>
                    <option value="contactSensors">Contact Sensors (Doors/Windows)</option>
                    <option value="motionSensors">Motion Sensors</option>
                    <option value="blinds">Blinds / Curtains</option>
                </select>
            </div>
            <div class="form-row">
                <label>Room:</label>
                <select id="new-acc-room" class="form-input">
                    <option value="Living">Living Room</option>
                    <option value="Bedroom">Bedroom</option>
                    <option value="Kitchen">Kitchen</option>
                    <option value="Bathroom">Bathroom</option>
                    <option value="Hallway">Hallway</option>
                    <option value="Outdoor">Outdoor</option>
                </select>
            </div>
            <button onclick="saveNewAccessory()" class="btn-full-success" style="margin-top: 15px;">💾 Save
                Accessory</button>
        </div>
    </div>

    <smart-modal></smart-modal>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/app.js"></script>
</body>

</html>
