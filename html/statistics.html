<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lumen - Statistics & History</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/components.js"></script>
</head>

<body>
    <smart-nav></smart-nav>
    <main>
        <div class="page-header">
            <button class="menu-toggle-btn" onclick="toggleNav()">☰</button>
            <h1>Statistics & Log</h1>
        </div>
        <p class="page-subtitle">Monitor energy consumption, climate history, and view home events.</p>

        <div class="stats-card"
            style="background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: var(--shadow-soft); margin-bottom: 25px;">
            <div class="flex-between mb-20" style="flex-wrap: wrap; gap: 15px;">
                <div style="display: flex; gap: 8px; background: rgba(0,0,0,0.04); padding: 4px; border-radius: 8px;">
                    <button id="btn-type-energy" class="filter-btn active"
                        onclick="switchDashboardChartType('energy')">⚡ Energy</button>
                    <button id="btn-type-climate" class="filter-btn" onclick="switchDashboardChartType('climate')">🌡️
                        Climate</button>
                </div>

                <div style="display: flex; gap: 6px; background: rgba(0,0,0,0.04); padding: 4px; border-radius: 8px;">
                    <button id="btn-dash-1d" class="filter-btn" onclick="switchDashboardPeriod('1d')">1 Day</button>
                    <button id="btn-dash-7d" class="filter-btn active" onclick="switchDashboardPeriod('7d')">7
                        Days</button>
                    <button id="btn-dash-30d" class="filter-btn" onclick="switchDashboardPeriod('30d')">30 Days</button>
                    <button id="btn-dash-6m" class="filter-btn" onclick="switchDashboardPeriod('6m')">6 Months</button>
                    <button id="btn-dash-1y" class="filter-btn" onclick="switchDashboardPeriod('1y')">1 Year</button>
                </div>
            </div>

            <div id="dashboard-chart-content" style="min-height: 240px; margin-top: 15px;"></div>
        </div>

        <div class="stats-card"
            style="background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: var(--shadow-soft);">
            <h3 class="m-0 text-accent mb-20">📝 Security and Events Log</h3>
            <div id="logs-container"
                style="display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px;">
            </div>
        </div>
    </main>

    <smart-modal></smart-modal>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/app.js"></script>
</body>

</html>
