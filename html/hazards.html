<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lumen - Hazards & Alerts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/components.js"></script>
</head>

<body>
    <smart-nav></smart-nav>
    <main>
        <div class="page-header">
            <button class="menu-toggle-btn" onclick="toggleNav()">☰</button>
            <h1>Risk & Hazard Sensors</h1>
        </div>

        <div class="danger-panel status-safe" id="panel-flood">
            <span class="danger-icon">💧</span>
            <h2>Flood Sensor (Bathroom)</h2>
            <p id="status-flood" class="text-success" style="font-weight: bold; font-size: 1.1em;">Normal State</p>
            <div id="controls-flood" style="margin-top: 20px; display: flex; justify-content: center;">
                <button type="button" class="btn-simulate" onclick="simulateFlood()">Simulate Flood</button>
                <button type="button" class="btn-stop" onclick="resetFlood()" style="display: none;">Stop Alarm and
                    Valve</button>
            </div>
        </div>

        <div class="danger-panel status-safe" id="panel-fire">
            <span class="danger-icon">🔥</span>
            <h2>Smoke & Gas Detector (Kitchen)</h2>
            <p id="status-fire" class="text-success" style="font-weight: bold; font-size: 1.1em;">Normal State</p>
            <div id="controls-fire" style="margin-top: 20px; display: flex; justify-content: center;">
                <button type="button" class="btn-simulate" onclick="simulateFire()">Simulate Smoke Detection</button>
                <button type="button" class="btn-stop" onclick="resetFire()" style="display: none;">Stop Alarm and
                    Gas</button>
            </div>
        </div>
    </main>
    <smart-modal></smart-modal>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/validation.js"></script>
    <script type="module">
        import { simulateFlood, resetFlood, simulateFire, resetFire } from '../js/validation.js';

        document.addEventListener('DOMContentLoaded', () => {
            const btnSimFlood = document.querySelector('#panel-flood .btn-simulate');
            const btnStopFlood = document.querySelector('#panel-flood .btn-stop');
            if (btnSimFlood) btnSimFlood.addEventListener('click', () => simulateFlood(true));
            if (btnStopFlood) btnStopFlood.addEventListener('click', () => resetFlood());

            const btnSimFire = document.querySelector('#panel-fire .btn-simulate');
            const btnStopFire = document.querySelector('#panel-fire .btn-stop');
            if (btnSimFire) btnSimFire.addEventListener('click', () => simulateFire(true));
            if (btnStopFire) btnStopFire.addEventListener('click', () => resetFire());

            setTimeout(() => {
                if (localStorage.getItem('floodHazard') === 'true') {
                    simulateFlood(false);
                }
                if (localStorage.getItem('fireHazard') === 'true') {
                    simulateFire(false);
                }
            }, 100);
        });
    </script>
</body>

</html>
